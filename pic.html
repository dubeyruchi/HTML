<!DOCTYPE html>
<html>
<head>
<title>Header Footer Example</title>

<style>

/* Header Style */
header{
    background-color bla;
    color:white;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:10px 20px;
}

.logo{
    width:50px;
}

.brand{
    font-size:22px;
    font-weight:bold;
}

nav a{
    color:white;
    text-decoration:none;
    margin:10px;
}

nav a:hover{
    color:yellow;
}

/* Footer Style */

footer{
    background:;
    color:white;
    display:flex;
    justify-content:space-around;
    padding:20px;
}

.footer-section{
    width:22%;
}

.footer-section a{
    display:block;
    color:white;
    text-decoration:none;
    margin:5px 0;
}

.footer-section a:hover{
    color:yellow;
}

.biglogo{
    width:120px;
}

</style>
</head>

<body>

<!-- HEADER -->

<header>

<div>
<img src="logo.png" class="logo">
</div>

<div class="brand">
My Website
</div>

<nav>
<a href="#">Home</a>
<a href="#">Course</a>
<a href="#">About</a>
<a href="#">Contact</a>
</nav>

</header>

<!-- PAGE CONTENT -->

<h2 style="text-align:center;">Welcome to my website</h2>

<!-- FOOTER -->

<footer>

<!-- Section 1 -->

<div class="footer-section">
<h3>Contact</h3>
<p>Mobile: 9876543210</p>
<p>Address: Patna, Bihar</p>
</div>

<!-- Section 2 -->

<div class="footer-section">
<h3>Links</h3>
<a href="#">Internal Link 1</a>
<a href="#">Internal Link 2</a>
<a href="https://google.com">External Link</a>
</div>

<!-- Section 3 -->

<div class="footer-section">
<h3>Logo</h3>
<img src="logo.png" class="biglogo">
</div>

<!-- Section 4 -->

<div class="footer-section">
<h3>Follow Us</h3>
<a href="#">Facebook</a>
<a href="#">Instagram</a>
<a href="#">Twitter</a>
</div>

</footer>

</body>
</html>
